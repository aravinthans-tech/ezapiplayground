services:
  - type: web
    name: ezapiplayground
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
    # Note: Add sensitive environment variables (API keys, connection strings) 
    # directly in Render dashboard, not in this file

